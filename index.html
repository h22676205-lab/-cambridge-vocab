<!DOCTYPE html>

<style>

  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Microsoft JhengHei","PingFang TC",-apple-system,sans-serif;

  header{
    text-align:center; padding:18px 10px 10px;
  }
  header h1{ margin:0; font-size:1.5rem; color:#5b4b8a; }
  header p{ margin:4px 0 0; color:#888; font-size:.85rem; }
  .speed-row{
    display:flex; align-items:center; justify-content:center; gap:10px; margin:12px auto 0;
    max-width:340px; background:#fff; padding:8px 16px; border-radius:16px; box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .speed-row label{ font-size:.85rem; color:#666; white-space:nowrap; }
  .speed-row input[type=range]{ flex:1; }

  .tabs{
    display:flex; justify-content:center; gap:8px; margin:14px auto; flex-wrap:wrap; max-width:900px; padding:0 10px;
  }
  .tabs button{
    border:none; padding:10px 18px; border-radius:20px; font-size:1rem; cursor:pointer;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.08); font-weight:bold; color:#555;
  }
  .tabs button.active{ background:var(--purple); color:#fff; }

  .panel{ max-width:960px; margin:0 auto; padding:0 14px 60px; }
  .hidden{ display:none !important; }

  .cat-select{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;
  }
  .cat-select button{
    border:2px solid #ddd; background:#fff; border-radius:16px; padding:6px 14px; font-size:.9rem; cursor:pointer; color:#666;
  }
  .cat-select button.active{ background:var(--blue); color:#fff; border-color:var(--blue); }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;
  }
  .card{
    background:var(--card); border-radius:16px; padding:14px 10px; text-align:center;

  .card:active{ transform:scale(.96); }
  .card .en{ font-size:1.3rem; font-weight:bold; color:#3a3a3a; word-break:break-word; }
  .card .zh{
    font-size:1.5rem; margin-top:8px; letter-spacing:4px; color:#3a3a3a;
    font-family:"BpmfZihiKaiStd","Microsoft JhengHei",serif;

    background:#fff; border-radius:16px; padding:18px; box-shadow:0 3px 10px rgba(0,0,0,.08); margin-bottom:20px;

  .settings-row label.title{ min-width:110px; font-weight:bold; color:#555; }
  .seg{
    display:flex; border-radius:14px; overflow:hidden; border:2px solid var(--purple);
  }
  .seg button{
    border:none; background:#fff; color:var(--purple); padding:8px 16px; cursor:pointer; font-size:.95rem;
  }
  .seg button.active{ background:var(--purple); color:#fff; }
  .group-seg{ justify-content:center; margin:0 auto 14px; width:fit-content; }
  input[type=range]{ flex:1; min-width:120px; }
  .interval-val{ font-weight:bold; color:#5b4b8a; min-width:52px; text-align:center; }

    background:#fff; border-radius:20px; padding:40px 20px; text-align:center; box-shadow:0 3px 10px rgba(0,0,0,.08); min-height:220px;

<header>

  <div class="speed-row">
    <label for="speedRange">🐢 語速 🐇</label>
    <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1">

</header>

  <button id="tabQuiz">📝 考試模式</button>
</div>

    <button data-v="week">📅 每週進度</button>
  </div>

/* 手機瀏覽器（尤其 iOS Safari）只允許「已被使用者手動觸發過」的同一個 <audio>
   元素繼續自動播放；每次都 new Audio() 會在考試模式連續自動播放幾個字後被瀏覽器擋掉、
   從此靜音。所以整個 App 共用這一個元素，並在按下「開始測驗」等真人點擊時解鎖它。 */
const audioPlayer = new Audio();
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  audioPlayer.play().catch(()=>{});
  audioPlayer.pause();
}

let playToken = 0;
function stopAllAudio(){
  playToken++; // invalidate any in-flight callbacks from a previous playEnglish() call
  audioPlayer.onended = null;
  audioPlayer.onerror = null;
  audioPlayer.pause();
}
function playEnglish(en, onDone){
  stopAllAudio();
  const token = playToken;
  const files = AUDIO_MAP[en];
  if(!files){ if(onDone) onDone(); return; } // no recording yet -- stay silent, no machine voice fallback
  const list = Array.isArray(files) ? files : [files];
  let i = 0;
  const playNext = ()=>{
    if(token !== playToken) return; // a newer click already took over
    if(i >= list.length){ if(onDone) onDone(); return; }
    audioPlayer.src = `audio/${list[i]}`;
    audioPlayer.playbackRate = speechSpeed;
    audioPlayer.onended = ()=>{ if(token===playToken){ i++; playNext(); } };
    audioPlayer.play().catch(()=>{ if(token===playToken){ i++; playNext(); } });
  };
  playNext();
}

      [...catSelectLearn.children].forEach(b=>b.classList.remove("active"));

      renderGrid();
    };
    catSelectLearn.appendChild(btn);
  });
}

  const b = e.target.closest("button"); if(!b) return;
  learnGroup = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("active", x===b));
  learnCat = GROUPS[learnGroup][0][0];
  renderCatSelectLearn();
  renderGrid();
};

function renderGrid(){
  const grid = document.getElementById("wordGrid");
  grid.innerHTML = "";
  const list = GROUPS[learnGroup].find(c=>c[0]===learnCat)[1];
  list.forEach(([en, zh])=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="en">${en}</div>
      <div class="zh">${zh}</div>
    `;
    card.onclick = ()=>{
      unlockAudio();
      playEnglish(en);
    };
    grid.appendChild(card);
  });
}
renderGrid();

/* ===================== 考試模式設定 ===================== */
let quizGroup = "topic";
let quizCats = new Set();
const catSelectQuiz = document.getElementById("catSelectQuiz");

function renderCatSelectQuiz(){
  catSelectQuiz.innerHTML = "";
  GROUPS[quizGroup].forEach(([cat])=>{
    const btn = document.createElement("button");
    btn.textContent = cat;
    if(quizCats.has(cat)) btn.classList.add("active");
    btn.onclick = ()=>{
      if(quizCats.has(cat)){ quizCats.delete(cat); btn.classList.remove("active"); }
      else { quizCats.add(cat); btn.classList.add("active"); }
    };
    catSelectQuiz.appendChild(btn);
  });
}
renderCatSelectQuiz();

document.getElementById("groupSegQuiz").onclick = (e)=>{
  const b = e.target.closest("button"); if(!b) return;
  quizGroup = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("active", x===b));
  quizCats = new Set();
  renderCatSelectQuiz();
};

let orderMode = "seq";
document.getElementById("orderSeg").onclick = (e)=>{
  const b = e.target.closest("button"); if(!b) return;
  orderMode = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("active", x===b));
};

let showMode = "both";
document.getElementById("showSeg").onclick = (e)=>{
  const b = e.target.closest("button"); if(!b) return;
  showMode = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("active", x===b));
};

const intervalRange = document.getElementById("intervalRange");
const intervalVal = document.getElementById("intervalVal");
intervalRange.oninput = ()=>{ intervalVal.textContent = intervalRange.value + " 秒"; };

/* ===================== 考試模式運作 ===================== */
let quizQueue = [];
let quizIndex = -1;
let quizTimer = null;
let quizPaused = false;
let quizRunning = false;

const btnStart = document.getElementById("btnStart");
const btnPause = document.getElementById("btnPause");
const btnStop = document.getElementById("btnStop");
const quizCatEl = document.getElementById("quizCat");
const quizProgEl = document.getElementById("quizProg");
const quizEnEl = document.getElementById("quizEn");
const quizZhEl = document.getElementById("quizZh");

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQueue(){
  let list = flattenGroup(quizGroup).filter(w=>quizCats.has(w.cat));
  if(orderMode==="rand") list = shuffle(list);
  return list;
}

function startQuiz(){
  unlockAudio();
  quizQueue = buildQueue();
  if(quizQueue.length===0){
    alert("請至少選擇一個單字範圍！");
    return;
  }
  quizIndex = -1;
  quizRunning = true;
  quizPaused = false;
  btnStart.disabled = true;
  btnPause.disabled = false;
  btnStop.disabled = false;
  btnPause.textContent = "⏸ 暫停";
  nextQuizWord();
}

function nextQuizWord(){
  quizIndex++;
  if(quizIndex >= quizQueue.length){
    quizEnEl.textContent = "🎉 測驗完成！";
    quizZhEl.textContent = "";
    quizCatEl.textContent = "全部念完了";
    stopQuiz();
    return;
  }
  const w = quizQueue[quizIndex];
  quizCatEl.textContent = w.cat;
  quizProgEl.textContent = (quizIndex+1) + " / " + quizQueue.length;

  quizEnEl.textContent = w.en;
  quizZhEl.textContent = (showMode==="both") ? w.zh : "";

  playEnglish(w.en, ()=>{
    // interval only starts counting once the word has actually finished playing
    const seconds = parseFloat(intervalRange.value);
    quizTimer = setTimeout(()=>{
      if(!quizPaused) nextQuizWord();
    }, seconds*1000);
  });
}

function pauseQuiz(){
  if(!quizRunning) return;
  quizPaused = !quizPaused;
  if(quizPaused){
    clearTimeout(quizTimer);
    stopAllAudio();
    btnPause.textContent = "▶️ 繼續";
  } else {
    unlockAudio();
    btnPause.textContent = "⏸ 暫停";
    nextQuizWord();
  }
}

function stopQuiz(){
  quizRunning = false;
  quizPaused = false;
  clearTimeout(quizTimer);
  stopAllAudio();
  btnStart.disabled = false;
  btnPause.disabled = true;
  btnStop.disabled = true;
}

btnStart.onclick = startQuiz;
btnPause.onclick = pauseQuiz;
btnStop.onclick = ()=>{
  stopQuiz();
  quizEnEl.textContent = "準備好了嗎？";
  quizZhEl.textContent = "";
  quizCatEl.textContent = "尚未開始";
  quizProgEl.textContent = "0 / 0";
};
</script>
</body>
</html>
